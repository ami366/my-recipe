<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf9f6"><meta name="apple-mobile-web-app-capable" content="yes"><title>My Recipe</title><style>
:root{--bg:#faf9f6;--ink:#282c28;--muted:#8a8e88;--line:#e8e8e2;--green:#637d69;--pale:#e9eee7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}header{padding:22px 20px 12px;max-width:700px;margin:auto}.eyebrow{color:var(--green);letter-spacing:.22em;font-size:10px;font-weight:700}h1{font-family:Georgia,serif;font-weight:400;font-size:35px;margin:4px 0 7px}.sub{font-size:12px;color:var(--muted)}main{max-width:700px;margin:auto;padding:0 16px 105px}.search{background:white;border:1px solid var(--line);border-radius:15px;padding:13px 14px;width:100%;outline:none;margin:13px 0}.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 14px;scrollbar-width:none}.chip{border:1px solid var(--line);background:white;padding:9px 15px;border-radius:25px;white-space:nowrap;font-size:12px}.chip.active{background:var(--ink);color:white}.section-head{display:flex;align-items:center;justify-content:space-between;margin:8px 1px 14px}.section-head h2{font-size:19px;font-weight:600;margin:0}.section-head small{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{background:white;border:1px solid var(--line);border-radius:17px;overflow:hidden}.cover{height:145px;background:#e9ebe5;display:grid;place-items:center;font-size:37px;position:relative}.cover img{width:100%;height:100%;object-fit:cover}.heart{position:absolute;right:9px;top:9px;border:0;background:#fffE;border-radius:50%;width:34px;height:34px;font-size:20px;color:#8b9388}.heart.on{color:#d87677}.cardbody{padding:12px}.cat{font-size:10px;color:var(--green);letter-spacing:.07em}.cardname{font-size:14px;font-weight:650;margin:5px 0 9px;min-height:38px}.cardfoot{font-size:11px;color:var(--muted)}nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffF5;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 4px calc(10px + env(safe-area-inset-bottom));z-index:20}nav button{border:0;background:none;color:#999f99;font-size:10px;min-width:58px;display:flex;align-items:center;flex-direction:column;gap:4px}nav button span{font-size:22px}nav button.active{color:var(--green);font-weight:700}.plus{background:var(--green);color:white;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;font-size:27px!important;margin-top:-12px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:13px}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:650;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px;color:var(--ink);outline:none}.field textarea{min-height:90px;resize:vertical}.hint{font-size:11px;color:var(--muted);line-height:1.6;margin-top:6px}.btn{border:0;background:var(--green);color:white;padding:12px 17px;border-radius:12px;font-size:13px;font-weight:650}.btn.secondary{background:var(--pale);color:var(--ink)}.btn.danger{background:#fff0ee;color:#ad5650}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{text-align:center;padding:60px 15px;color:var(--muted);line-height:1.9}.empty .emoji{font-size:43px}.detail-cover{width:100%;height:245px;object-fit:cover;border-radius:16px;background:#e9ebe5}.detail-title{font-size:26px;margin:15px 0 8px}.detail-section{margin-top:25px}.detail-section h3{font-size:17px;border-bottom:1px solid var(--line);padding-bottom:10px}.ingredient{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:11px 0;font-size:13px;gap:8px}.step{white-space:pre-wrap;line-height:1.9;font-size:14px}.servings{display:flex;align-items:center;gap:12px}.servings button{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;background:white}.checkline{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:12px 0;font-size:13px}.checkline input{accent-color:var(--green);width:18px;height:18px}.checkline.done span{text-decoration:line-through;color:#aaa}.topback{border:0;background:none;padding:10px 0;color:var(--green)}.notice{font-size:12px;color:var(--muted);line-height:1.8}.preview{max-width:100%;max-height:180px;object-fit:cover;border-radius:12px;margin-top:10px}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#303831;color:white;border-radius:25px;padding:11px 19px;font-size:12px;z-index:30;white-space:nowrap}.tiny{font-size:12px;color:var(--muted)}@media(min-width:520px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.cover{height:180px}}
</style></head><body><header><div class="eyebrow">YOUR PERSONAL COOKBOOK</div><h1>My Recipe<span style="color:#91a493">.</span></h1><div class="sub">お気に入りの味を、ひとつずつ。</div></header><main id="app"></main><nav id="nav"></nav><script>
'use strict';const KEY='myrecipe_v1',SHOP='myrecipe_shop_v1';let recipes=load(KEY,[]),shopping=load(SHOP,[]),page='home',category='すべて',query='',editing=null,detailId=null,servings=2,photo='';const categories=['主菜','副菜','汁物','ごはん','麺類','お菓子','その他'];function load(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function persist(){try{localStorage.setItem(KEY,JSON.stringify(recipes));localStorage.setItem(SHOP,JSON.stringify(shopping));return true}catch{alert('保存容量がいっぱいです。写真を減らすかバックアップを作成してください。');return false}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){document.querySelector('.toast')?.remove();let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2300)}function go(p){page=p;query='';render();scrollTo(0,0)}function nav(){document.getElementById('nav').innerHTML=[['home','⌂','ホーム'],['search','⌕','検索'],['edit','＋','追加'],['favorites','♡','お気に入り'],['shopping','☷','買い物']].map(([p,icon,label])=>`<button class="${page===p?'active':''}" onclick="${p==='edit'?'newRecipe()':`go('${p}')`}"><span class="${p==='edit'?'plus':''}">${icon}</span>${label}</button>`).join('')}function card(r){return `<article class="card"><div class="cover" onclick="openDetail('${r.id}')">${r.photo?`<img src="${r.photo}" alt="">`:'🍽️'}<button class="heart ${r.favorite?'on':''}" onclick="toggleFavorite('${r.id}')">${r.favorite?'♥':'♡'}</button></div><div class="cardbody" onclick="openDetail('${r.id}')"><div class="cat">${esc(r.category)}</div><div class="cardname">${esc(r.name)}</div><div class="cardfoot">${r.servings||2}人分 ${r.url?' · 🔗':''}</div></div></article>`}function listPage(){let filtered=recipes.filter(r=>(page!=='favorites'||r.favorite)&&(category==='すべて'||page==='favorites'||page==='search'||r.category===category)&&(!query||[r.name,r.category,r.ingredients,r.steps].join(' ').toLowerCase().includes(query.toLowerCase())));return `${page==='search'?`<input class="search" id="search" placeholder="料理名・材料から検索" value="${esc(query)}" oninput="updateSearch(this.value)">`:page==='home'?`<div class="chips">${['すべて',...categories].map(c=>`<button class="chip ${category===c?'active':''}" onclick="category='${c}';render()">${c}</button>`).join('')}</div>`:''}<div class="section-head"><h2>${page==='favorites'?'お気に入り':page==='search'?'レシピを探す':'レシピ一覧'}</h2><small>${filtered.length} recipes</small></div>${filtered.length?`<div class="cards">${filtered.map(card).join('')}</div>`:`<div class="empty"><div class="emoji">📖</div>${page==='favorites'?'お気に入りはまだありません':page==='search'?'検索できるレシピがありません':'レシピを登録してみよう'}<br><button class="btn secondary" onclick="newRecipe()">＋ レシピを追加</button></div>`}`}function updateSearch(v){query=v;let pos=document.activeElement?.selectionStart;let filtered=recipes.filter(r=>[r.name,r.category,r.ingredients,r.steps].join(' ').toLowerCase().includes(query.toLowerCase()));document.querySelector('.section-head small').textContent=filtered.length+' recipes';document.querySelector('.cards')?.remove();document.querySelector('.empty')?.remove();document.querySelector('.section-head').insertAdjacentHTML('afterend',filtered.length?`<div class="cards">${filtered.map(card).join('')}</div>`:'<div class="empty">見つかりませんでした</div>')}function toggleFavorite(id){let r=recipes.find(x=>x.id===id);if(r){r.favorite=!r.favorite;persist();render()}}function newRecipe(id=null){editing=id;photo=id?recipes.find(r=>r.id===id)?.photo||'':'';page='edit';render();scrollTo(0,0)}function formPage(){let r=recipes.find(x=>x.id===editing)||{};return `<button class="topback" onclick="go('home')">‹ 戻る</button><div class="section-head"><h2>${editing?'レシピを編集':'新しいレシピ'}</h2></div><form id="recipeform" class="panel" onsubmit="saveRecipe(event)"><div class="field"><label>料理名 *</label><input name="name" required maxlength="100" value="${esc(r.name)}" placeholder="例：鶏の照り焼き"></div><div class="field"><label>料理の写真</label><input type="file" accept="image/*" onchange="setPhoto(this)"><div class="hint">カメラで撮影した写真やアルバムの画像を登録できます。</div><div id="photobox">${photo?`<img class="preview" src="${photo}"><br><button type="button" class="btn secondary" onclick="photo='';document.getElementById('photobox').innerHTML=''">写真を削除</button>`:''}</div></div><div class="field"><label>カテゴリ</label><select name="category">${categories.map(c=>`<option ${r.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>基本の人数</label><input type="number" name="servings" min="1" max="100" value="${r.servings||2}" required></div><div class="field"><label>材料と分量</label><textarea name="ingredients" placeholder="鶏もも肉 | 300 | g&#10;しょうゆ | 2 | 大さじ&#10;砂糖 | 1 | 大さじ">${esc(r.ingredients)}</textarea><div class="hint">1行につき「材料名 | 数字 | 単位」で入力。例：玉ねぎ | 1 | 個。数字の部分は人数に合わせて自動計算されます。</div></div><div class="field"><label>作り方</label><textarea name="steps" style="min-height:170px" placeholder="1. 材料を切る&#10;2. フライパンで炒める">${esc(r.steps)}</textarea></div><div class="field"><label>参考URL（任意）</label><input name="url" type="url" value="${esc(r.url)}" placeholder="https://..."><div class="hint">レシピサイトのリンクを保存できます。サイト内容の自動取り込みは非対応です。</div></div><div class="field"><label>🍳 アレンジ（任意）</label><textarea name="arrangement" placeholder="例：砂糖を半分にする、チーズを追加する">${esc(r.arrangement)}</textarea><div class="hint">元のレシピとは別に、自分流の変更点を残せます。</div></div><div class="field"><label>メモ（任意）</label><textarea name="memo" placeholder="家族の好み、コツなど">${esc(r.memo)}</textarea></div><button class="btn" type="submit" style="width:100%">${editing?'変更を保存':'レシピを保存'}</button></form>`}async function setPhoto(el){let file=el.files?.[0];if(!file)return;try{let img=new Image(),url=URL.createObjectURL(file);await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=url});let ratio=Math.min(1,900/img.width,900/img.height),c=document.createElement('canvas');c.width=Math.round(img.width*ratio);c.height=Math.round(img.height*ratio);c.getContext('2d').drawImage(img,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.68);URL.revokeObjectURL(url);document.getElementById('photobox').innerHTML=`<img class="preview" src="${photo}"><br><button type="button" class="btn secondary" onclick="photo='';document.getElementById('photobox').innerHTML=''">写真を削除</button>`}catch{alert('画像を読み込めませんでした')}}function saveRecipe(e){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')).trim();if(!name)return;let old=recipes.find(r=>r.id===editing);let url=String(f.get('url')||'').trim();if(url&&!/^https?:\/\//i.test(url)){alert('URLはhttps://から入力してください');return}let r={id:editing||String(Date.now())+Math.random().toString(36).slice(2),name,photo,category:String(f.get('category')),servings:Number(f.get('servings'))||2,ingredients:String(f.get('ingredients')),steps:String(f.get('steps')),url,arrangement:String(f.get('arrangement')||''),memo:String(f.get('memo')),favorite:old?.favorite||false};if(old)recipes=recipes.map(x=>x.id===editing?r:x);else recipes.unshift(r);if(persist()){detailId=r.id;page='detail';render();scrollTo(0,0);toast('保存しました')}}function openDetail(id){detailId=id;let r=recipes.find(x=>x.id===id);servings=r?.servings||2;page='detail';render();scrollTo(0,0)}function ingredients(r){return (r.ingredients||'').split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{let p=x.split('|').map(y=>y.trim());return {name:p[0],qty:p[1],unit:p.slice(2).join('|')}})}function fmt(q,base,current){let n=Number(q);if(!q||!Number.isFinite(n))return q||'';let v=Math.round(n*current/base*100)/100;return String(v)}function detailPage(){let r=recipes.find(x=>x.id===detailId);if(!r)return '<p>レシピが見つかりません</p>';return `<button class="topback" onclick="go('home')">‹ レシピ一覧</button>${r.photo?`<img class="detail-cover" src="${r.photo}">`:`<div class="detail-cover" style="display:grid;place-items:center;font-size:60px">🍽️</div>`}<div class="cat" style="margin-top:18px">${esc(r.category)}</div><h2 class="detail-title">${esc(r.name)}</h2><div class="actions"><button class="btn secondary" onclick="toggleFavorite('${r.id}')">${r.favorite?'♥ お気に入り済':'♡ お気に入り'}</button><button class="btn secondary" onclick="newRecipe('${r.id}')">✎ 編集</button><button class="btn danger" onclick="deleteRecipe('${r.id}')">削除</button></div><div class="detail-section"><h3>材料 <span class="tiny">（人数に合わせて計算）</span></h3><div class="servings"><button onclick="changeServings(-1)">−</button><strong>${servings}人分</strong><button onclick="changeServings(1)">＋</button></div>${ingredients(r).length?ingredients(r).map(x=>`<div class="ingredient"><span>${esc(x.name)}</span><strong>${esc(fmt(x.qty,r.servings,servings))} ${esc(x.unit)}</strong></div>`).join(''):'<p class="tiny">材料は未登録です</p>'}<button class="btn secondary" style="margin-top:14px" onclick="addIngredients()">＋ 材料を買い物リストに追加</button></div><div class="detail-section"><h3>作り方</h3><div class="step">${esc(r.steps||'まだ登録されていません')}</div></div>${r.arrangement?`<div class="detail-section"><h3>🍳 アレンジ</h3><div class="step">${esc(r.arrangement)}</div></div>`:''}${r.memo?`<div class="detail-section"><h3>メモ</h3><div class="step">${esc(r.memo)}</div></div>`:''}${r.url?`<div class="detail-section"><h3>参考リンク</h3><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer" style="color:var(--green);word-break:break-all">${esc(r.url)}</a></div>`:''}`};function changeServings(n){servings=Math.max(1,Math.min(100,servings+n));render()}function deleteRecipe(id){if(confirm('このレシピを削除しますか？')){recipes=recipes.filter(r=>r.id!==id);persist();go('home');toast('削除しました')}}function addIngredients(){let r=recipes.find(x=>x.id===detailId);let rows=ingredients(r);if(!rows.length){toast('材料が登録されていません');return}for(let x of rows){shopping.push({id:String(Date.now())+Math.random(),name:x.name,amount:[fmt(x.qty,r.servings,servings),x.unit].filter(Boolean).join(' '),done:false})}persist();toast('買い物リストに追加しました')}function shoppingPage(){return `<div class="section-head"><h2>買い物リスト</h2><small>${shopping.filter(x=>!x.done).length} 件</small></div><div class="panel"><form onsubmit="addShopping(event)" class="actions"><input name="item" required placeholder="追加する食材" style="flex:1;min-width:120px;border:1px solid var(--line);border-radius:10px;padding:12px"><button class="btn">追加</button></form>${shopping.length?shopping.map(x=>`<label class="checkline ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} onchange="checkShopping('${x.id}',this.checked)"><span style="flex:1">${esc(x.name)} <small>${esc(x.amount)}</small></span><button class="btn secondary" onclick="removeShopping('${x.id}')" type="button">×</button></label>`).join(''):'<div class="empty">まだ買い物リストは空です 🛒</div>'}${shopping.length?'<button class="btn secondary" style="margin-top:15px" onclick="clearDone()">チェック済みを削除</button>':''}</div><div class="panel"><h3>データのバックアップ</h3><p class="notice">このアプリのデータはSafari内に保存されます。Safariのデータ削除や端末変更に備えて、ときどきバックアップを保存してください。</p><div class="actions"><button class="btn secondary" onclick="exportData()">バックアップを書き出す</button><label class="btn secondary">バックアップを復元<input type="file" accept="application/json,.json" style="display:none" onchange="importData(this)"></label></div></div>`}function addShopping(e){e.preventDefault();let name=new FormData(e.target).get('item').trim();if(name){shopping.push({id:String(Date.now())+Math.random(),name,amount:'',done:false});persist();render()}}function checkShopping(id,v){let x=shopping.find(x=>x.id===id);if(x){x.done=v;persist();render()}}function removeShopping(id){shopping=shopping.filter(x=>x.id!==id);persist();render()}function clearDone(){shopping=shopping.filter(x=>!x.done);persist();render()}function exportData(){let data=JSON.stringify({app:'myrecipe',version:1,recipes,shopping}),blob=new Blob([data],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='myrecipe-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}async function importData(el){let f=el.files?.[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(obj.app!=='myrecipe'||!Array.isArray(obj.recipes)||!Array.isArray(obj.shopping))throw Error();if(!confirm('現在のレシピと買い物リストをバックアップの内容に置き換えますか？'))return;recipes=obj.recipes;shopping=obj.shopping;if(persist()){render();toast('復元しました')}}catch{alert('正しいバックアップファイルを選んでください')}}function render(){nav();document.getElementById('app').innerHTML=page==='edit'?formPage():page==='detail'?detailPage():page==='shopping'?shoppingPage():listPage()}render();
</script></body></html>
